name: Security

# Spec 23 — the "Dependency / Security Gate" required-check category.
# Three independent scans (dependency advisories, secrets, static analysis)
# feed one stable aggregator job (`security-gate`) so branch protection has a
# single required check name regardless of how many tools run underneath it.
#
# UNVERIFIED: written and reviewable, but never run for real. See
# progress-tracker.md's spec 23 entry.

on:
  pull_request:
  schedule:
    # Weekly, matching architecture.md's "Automated dependency update pull
    # requests run on a weekly schedule" — this is the audit half of that;
    # `.github/dependabot.yml` is the pull-request half.
    - cron: "0 6 * * 1" # Monday 06:00 UTC

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      # architecture.md's CI/CD Pipeline Requirements: "no high or critical
      # severity dependency advisories" — never `npm audit fix` here (that's
      # a mutation; ai-workflow-rules.md requires dependency updates to
      # arrive as reviewable pull requests, not a CI-applied change).
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the diff
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub Organizations, not
          # personal accounts (github.com/jacobmelendez17/polyglot2.0) — see
          # gitleaks-action's own README. Revisit if this repo ever
          # transfers to an org.
          GITLEAKS_ENABLE_COMMENTS: false # keeps this job's permissions at contents: read

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload CodeQL's SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  security-gate:
    name: Dependency / Security Gate
    runs-on: ubuntu-latest
    needs: [dependency-audit, secret-scan, static-analysis]
    steps:
      - run: echo "All security checks passed."
